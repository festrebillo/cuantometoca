<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#faf8f5;color:#1d1a17;font-family:Geist,system-ui,sans-serif;display:grid;grid-template-columns:1fr 460px;gap:56px;padding:72px 80px;box-sizing:border-box;align-items:center}
